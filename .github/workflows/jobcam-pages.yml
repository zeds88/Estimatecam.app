name: Estimate Cam – test & publish

on:
  push:
    branches: [main]
    paths: ['jobcam/**', '.github/workflows/jobcam-pages.yml']
  pull_request:
    paths: ['jobcam/**', '.github/workflows/jobcam-pages.yml']
  workflow_dispatch:

permissions:
  contents: write # lets the job push the built site to the gh-pages branch

concurrency:
  group: jobcam-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobcam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobcam/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run lint
      - name: Build browser-test site
        run: npm run build
        env:
          VITE_POSTHOG_PROJECT_TOKEN: phc_jobcam_e2e
          VITE_POSTHOG_HOST: https://us.i.posthog.com
          VITE_POSTHOG_ENVIRONMENT: development
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build release site
        run: npm run build
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.JOBCAM_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.JOBCAM_POSTHOG_HOST }}
          VITE_POSTHOG_ENVIRONMENT: production
      # Publish only from push/dispatch (never from a PR). One-time repo setting:
      # Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: jobcam/dist
          force_orphan: true
          commit_message: 'Publish Estimate Cam ${{ github.sha }}'
